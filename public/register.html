<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Department Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">&#127891; Dept<span>Portal</span></a>
    <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/about">About Us</a></li>
    </ul>
    <div class="nav-right">
      <a href="/login" class="btn btn-outline btn-sm">Login</a>
      <a href="/register" class="btn btn-primary btn-sm">Register</a>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-container">
      <h2>Create Account</h2>
      <p class="form-subtitle">Join the department portal community</p>

      <div class="alert alert-error" id="regError"></div>
      <div class="alert alert-success" id="regSuccess"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="John Doe" required minlength="2">
          <span class="error-msg">Name must be at least 2 characters</span>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@university.edu" required>
          <span class="error-msg">Please enter a valid email</span>
        </div>
        <div class="form-group">
          <label for="department">Department</label>
          <select id="department" required>
            <option value="">Select your department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="Electrical">Electrical</option>
            <option value="Information Technology">Information Technology</option>
          </select>
          <span class="error-msg">Please select a department</span>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
          <span class="error-msg">Password must be at least 6 characters</span>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required minlength="6">
          <span class="error-msg">Passwords do not match</span>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="regBtn">Create Account</button>
      </form>

      <p class="form-footer">Already have an account? <a href="/login">Login here</a></p>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
