<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Department Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">&#127891; Dept<span>Portal</span></a>
    <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/about">About Us</a></li>
    </ul>
    <div class="nav-right">
      <a href="/login" class="btn btn-outline btn-sm">Login</a>
      <a href="/register" class="btn btn-primary btn-sm">Register</a>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-container">
      <h2>Welcome Back</h2>
      <p class="form-subtitle">Login to your department account</p>

      <div class="alert alert-error" id="loginError"></div>
      <div class="alert alert-success" id="loginSuccess"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@university.edu" required>
          <span class="error-msg">Please enter a valid email</span>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required minlength="6">
          <span class="error-msg">Password must be at least 6 characters</span>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Login</button>
      </form>

      <p class="form-footer">Don't have an account? <a href="/register">Register here</a></p>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
